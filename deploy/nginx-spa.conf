# 弦间 · 宝塔站点 nginx 配置片段
#
# 用法：宝塔 → 网站 → 设置 → 配置文件，把下面这几段合并进对应站点的
#      server { } 中，并把 root 改成 deploy.sh 的站点根目录（WEB_ROOT）。
#
# 宝塔自带配置里如果已经有 index、gzip、静态资源 expires 规则，
# 保留其中一份即可，不要重复添加同名指令。

    root /www/wwwroot/score.example.com;
    index index.html;

    # 前端路由回退：刷新 / 直接访问子路径时都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的资源可以长期缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 入口文件不缓存，保证每次发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }